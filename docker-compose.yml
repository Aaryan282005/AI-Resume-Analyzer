services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_resume_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_resume_frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000/analyze-resume
    depends_on:
      - backend